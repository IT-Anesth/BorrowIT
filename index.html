<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ระบบยืม-คืน Notebook</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
--bg1:#eef6ff;
--bg2:#fff3e6;
--card:#ffffff;
--line:#dde8f3;

--stBlue:#2563eb;
--stGreen:#16a34a;
--stOrange:#b45309;
--stRed:#dc2626;
--stGray:#475569;

--text:#0f1b3a;
--muted:#5a6aa3;

--brand:#2563eb;
--brand2:#06b6d4;

--ok:#16a34a;
--bad:#dc2626;
--warn:#f59e0b;

--shadow:0 14px 34px rgba(16,24,40,.10);
--radius:18px
}

*{box-sizing:border-box}

body{
margin:0;
font-family:Kanit,system-ui,-apple-system,Segoe UI,Roboto,Arial;
color:var(--text);
background:linear-gradient(180deg,var(--bg1),var(--bg2));
min-height:100vh;
overflow-x:hidden
}

header{
position:sticky;
top:0;
z-index:10;
background:rgba(255,255,255,.94);
backdrop-filter:saturate(160%) blur(10px);
border-bottom:1px solid var(--line)
}

.wrap{
max-width:1200px;
margin:0 auto;
padding:12px 16px
}

.topbar{
display:flex;
gap:12px;
align-items:center;
justify-content:space-between
}

.brand{
display:flex;
gap:12px;
align-items:center;
min-width:0
}

.logo{
display:flex;
align-items:center;
justify-content:center
}

.logo img{
height:68px
}

.title h1{
margin:0;
font-size:20px;
font-weight:800;
background:linear-gradient(90deg,#1d4ed8,#7c3aed);
-webkit-background-clip:text;
color:transparent
}

.title p{
margin:2px 0 0;
color:var(--muted)
}

/* ===== Date picker mobile fix ===== */

.dateIconOnly{
width:44px;
min-width:44px;
height:42px;
padding:6px;
border-radius:12px;
border:1px solid var(--line);
background:#fff;

appearance:auto;
-webkit-appearance:auto;
position:relative;
}

/* ซ่อนตัวเลขวันที่แต่ไม่ทำให้ไอคอนหาย */

.dateIconOnly::-webkit-datetime-edit{
opacity:0;
}

/* ซ่อน spin */

.dateIconOnly::-webkit-inner-spin-button{
display:none;
}

/* แสดงไอคอนปฏิทิน */

.dateIconOnly::-webkit-calendar-picker-indicator{
opacity:1;
display:block;
cursor:pointer;
width:24px;
height:24px;
}

/* ===== responsive ===== */

@media(max-width:768px){

.wrap{
padding:10px
}

.logo img{
height:56px
}

.title h1{
font-size:18px
}

}

</style>
</head>

<body>

<header>
<div class="wrap topbar">

<div class="brand">

<div class="logo">
<img src="logo.png">
</div>

<div class="title">
<h1>ระบบยืม-คืน Notebook</h1>
<p>ภาควิชาวิสัญญีวิทยา คณะแพทยศาสตร์ศิริราชพยาบาล</p>
</div>

</div>

</div>
</header>

<div class="wrap">

<h3>รายงานการใช้ Notebook</h3>

<div style="display:flex;gap:10px;align-items:center">

<label>วันที่</label>

<input type="date" class="dateIconOnly">

<button style="
background:#2563eb;
color:#fff;
border:none;
border-radius:10px;
padding:10px 16px;
font-family:Kanit;
cursor:pointer">
แสดงรายงาน
</button>

</div>

</div>

</body>
</html>
